<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SustainAds AI - Video Ad Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 SustainAds AI</h1>
            <p class="tagline">AI-Powered Video Ads for Climate-Resilient Local Businesses</p>
        </header>

        <main>
            <section class="form-section">
                <h2>Generate Your Video Ad</h2>
                <form id="videoForm">
                    <div class="form-group">
                        <label for="businessName">Business Name</label>
                        <input type="text" id="businessName" name="businessName" required placeholder="Enter your business name">
                    </div>

                    <div class="form-group">
                        <label for="businessType">Business Type</label>
                        <select id="businessType" name="businessType" required>
                            <option value="">Select a type</option>
                            <option value="restaurant">Restaurant</option>
                            <option value="retail">Retail Shop</option>
                            <option value="service">Service Provider</option>
                            <option value="cafe">Cafe/Coffee Shop</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Business Description</label>
                        <textarea id="description" name="description" required placeholder="Describe your business and what makes it sustainable..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="keywords">Keywords (comma-separated)</label>
                        <input type="text" id="keywords" name="keywords" placeholder="eco-friendly, local, organic">
                    </div>

                    <button type="submit" class="btn-primary">Generate Video Ad</button>
                </form>
            </section>

            <section class="result-section" id="resultSection" style="display: none;">
                <h2>Your Video Ad</h2>
                <div id="videoPlayer"></div>
                <div id="downloadLink"></div>
            </section>

            <section class="loading-section" id="loadingSection" style="display: none;">
                <div class="spinner"></div>
                <p>Generating your AI video ad... This may take a moment.</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 SustainAds AI. Supporting Climate-Resilient Local Businesses.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
